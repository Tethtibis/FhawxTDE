# ==============================================================================
# FHAWX-DECK TDE // TOUCHPAD & MOUSE CONFIGURATION
# Enables instant tap-to-click, natural scrolling, and 2-finger right-click
# ==============================================================================
Section "InputClass"
    Identifier "libinput touchpad catchall"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "Tapping" "on"
    Option "NaturalScrolling" "true"
    Option "ClickMethod" "clickfinger"
    Option "TappingButtonMap" "lrm"
    Option "DisableWhileTyping" "true"
EndSection
