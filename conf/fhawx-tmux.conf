# ==============================================================================
# FHAWXTDE // TMUX CONFIGURATION (Pure-Alt Ergonomics)
# Aesthetic: Monochromatic Burnt Orange (#CC5500 / #FF8C00)
# Hard Constraints: Strictly 2 Workspaces, Max 2 Panes, Pure-Alt Controls
# Works identically in local terminals, SSH sessions, and Kiosk X11 mode.
# ==============================================================================

# Enable full mouse support (trackpad tap-to-click, SSH mouse forwarding, pane select, resize)
set -g mouse on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc"
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1

# Border Styling (Active pane in bright burnt orange)
set -g pane-border-style "fg=#331100"
set -g pane-active-border-style "fg=#FF8C00,bold"

set -g window-size latest
setw -g aggressive-resize on

# ------------------------------------------------------------------------------
# TOP STATUS PANEL
# ------------------------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 3
set -g status-style "bg=#000000,fg=#CC5500"

# Left Status: Clickable App Launcher Button [⚡ APPS (Alt+A)]
set -g status-left-length 40
set -g status-left "#[bg=#CC5500,fg=#000000,bold] [⚡ APPS (Alt+A)] #[bg=#000000,fg=#CC5500] "

# Window Status (Dynamic indicator showing active panes e.g. 1:Main [1p] or [2p])
setw -g window-status-format "#[fg=#774400] #I:#W [#{window_panes}p] "
setw -g window-status-current-format "#[bg=#331100,fg=#FF8C00,bold] [#I:#W* [#{window_panes}p]] "

# Right Status: Hardware & Network Telemetry
set -g status-right-length 140
set -g status-right "#(~/.local/bin/fhawx-status-bar)"

# ------------------------------------------------------------------------------
# THE UNIFIED PURE-ALT CONTROL DECK
# ------------------------------------------------------------------------------
# 1. [A]pps / Menu: Alt + A or Alt + Space (Universal Launcher & Command Palette)
bind-key -n M-a     display-popup -w 75% -h 75% -E "~/.local/bin/fhawx-apps"
bind-key -n M-Space display-popup -w 75% -h 75% -E "~/.local/bin/fhawx-apps"
bind-key -n C-Space display-popup -w 75% -h 75% -E "~/.local/bin/fhawx-apps"
bind-key -n F1      display-popup -w 75% -h 75% -E "~/.local/bin/fhawx-apps"
bind-key -n MouseDown1StatusLeft display-popup -w 75% -h 75% -E "~/.local/bin/fhawx-apps"

# 2. [W]orkspace: Alt + W (Indestructible Toggle Between Workspace 1 and 2)
bind-key -n M-w run-shell "~/.local/bin/fhawx-workspace-toggle"
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2

# 3. [S]plit: Alt + S (Single-Key Toggle Between Single Pane and Dual Pane)
bind-key -n M-s if-shell '[ "$(tmux -L fhawx list-panes | wc -l)" -eq 1 ]' 'split-window -h "bash"' 'kill-pane -t :.2'

# 4. [K]ill: Alt + K (Protected Terminator - Default Focused on [ Cancel ])
bind-key -n M-k display-popup -w 55% -h 35% -E "~/.local/bin/fhawx-kill-pane"

# 5. Focus Navigation: Alt + Tab and Alt + O (Cycle Left ◄► Right Pane)
bind-key -n M-Tab select-pane -t :.+
bind-key -n M-o   select-pane -t :.+
bind-key -n BTab  select-pane -t :.-

# 6. Zoom: Alt + Z (Instant Fullscreen Focus on Current Pane)
bind-key -n M-z resize-pane -Z

# 7. [Q]uit to Shell: Alt + Q (Detach FhawxTDE and return to normal command line)
bind-key -n M-q detach-client

# ------------------------------------------------------------------------------
# HARD CONSTRAINTS (NO THIRD WORKSPACE PER OPERATOR REGULATION)
# ------------------------------------------------------------------------------
unbind c
bind-key -n M-n display-message "Workspaces hard-capped to 2 per FhawxTDE architecture."
bind-key -n C-t display-message "Workspaces hard-capped to 2 per FhawxTDE architecture."
